name: Auto Tag and Release

on:
  push:
    branches:
      - main

jobs:
  auto-tag-and-release:
    name: Build & Auto Publish Release
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Get Version from package.json
        id: package_version
        shell: powershell
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $ver = "v" + $pkg.version
          # Using utf8NoBOM encoding to prevent GitHub Actions env parsing failures
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "VERSION=$ver`n")
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$ver`n")

      - name: Check if Tag Already Exists
        id: check_tag
        shell: powershell
        run: |
          git fetch --tags
          $targetTag = "$env:VERSION"
          $exists = git tag -l $targetTag
          if ($exists) {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exists=true`n")
            Write-Host "Tag $targetTag already exists. Skipping release build."
          } else {
            [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, "exists=false`n")
          }

      - name: Install dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: npm ci

      - name: Build Vite Frontend
        if: steps.check_tag.outputs.exists == 'false'
        run: npm run build

      - name: Build and Publish Electron App
        if: steps.check_tag.outputs.exists == 'false'
        run: npx electron-builder --win --publish always -c.publish.releaseType=release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Git Tag
        if: steps.check_tag.outputs.exists == 'false'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag $env:VERSION
          git push origin $env:VERSION
